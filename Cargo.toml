[workspace]
members = ["crates/regie-core", "crates/regie"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "11"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "fs", "time", "io-util"] }

# Declared here as each crate first uses it (the milestone-1 stack):
# axum = "0.8"
# clap = { version = "4", features = ["derive"] }
# reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# rust-embed = "8"
# tracing = "0.1"
# uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"

[workspace.lints.cargo]
# regie-core declares its dependencies before the code that uses them lands.
unused_dependencies = "allow"
