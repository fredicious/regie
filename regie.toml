test_globs = ["tests/**"]

[workflow]
default_tier = "auto"
direct_execution = true
max_parallel_tasks = 3
plan_reviews = true
design_reviews = true
final_review = true
knowledge = true
reflection = true
submit_pr = true

[commands]
setup = "uv sync --frozen"
test = "uv run pytest -q"
lint = "uvx ruff check src tests"
