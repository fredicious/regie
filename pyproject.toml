[project]
name = "regie"
version = "0.1.0"
description = "Régie — multi-model agent orchestration harness: product brief in, reviewed tested PR out."
readme = "README.md"
authors = [
    { name = "Frederic Cabassut", email = "frederic.cabassut@arte.tv" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "typer>=0.27.0",
]

[project.scripts]
regie = "regie.cli:app"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
